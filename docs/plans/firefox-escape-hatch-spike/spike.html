<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Firefox emoji-surrogate DOM-insert spike</title>
<style>
  body { font: 16px system-ui; padding: 2rem; max-width: 720px; }
  h3 { margin-top: 1.5em; }
  #ce, textarea, input { border: 1px solid #888; padding: 8px; font-size: 18px; width: 100%; box-sizing: border-box; }
  #ce { min-height: 2em; }
  button { padding: 8px 14px; margin: 4px; font-size: 14px; cursor: pointer; }
  pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
  .hint { color: #666; font-size: 14px; }
</style>
</head>
<body>
<h2>Firefox emoji-surrogate DOM-insert spike</h2>
<p class="hint">Open DevTools (F12) → Console tab. Click the buttons below in order, or paste the script block manually.</p>

<h3>A. contenteditable div</h3>
<div id="ce" contenteditable="true">😭</div>

<h3>B. textarea</h3>
<textarea id="ta" rows="2">😭</textarea>

<h3>C. input</h3>
<input id="in" value="😭">

<h3>Run probes</h3>
<button onclick="probe1_exec('ce')">Probe 1 — execCommand on ce</button>
<button onclick="probe2_event('ce')">Probe 2 — InputEvent on ce</button>
<button onclick="probe1_exec('ta')">execCommand on textarea</button>
<button onclick="probe1_exec('in')">execCommand on input</button>
<button onclick="reset()">Reset all to 😭</button>

<h3>Output</h3>
<pre id="out"></pre>

<script>
function log(...args) {
  const line = args.map(a => typeof a === 'string' ? a : JSON.stringify(a)).join(' ');
  document.getElementById('out').textContent += line + '\n';
  console.log(...args);
}

function dump(id) {
  const el = document.getElementById(id);
  const t = el.value ?? el.textContent;
  const cp = [...t].map(c => c.codePointAt(0).toString(16).padStart(4, '0')).join(' ');
  const cu = [];
  for (let i = 0; i < t.length; i++) cu.push(t.charCodeAt(i).toString(16).padStart(4, '0'));
  log(`  ${id}: text=${JSON.stringify(t)} cp=[${cp}] cu=[${cu.join(' ')}]`);
}

function placeCaretAtEnd(id) {
  const el = document.getElementById(id);
  el.focus();
  if (el.value !== undefined) {
    el.setSelectionRange(el.value.length, el.value.length);
  } else {
    const r = document.createRange();
    r.selectNodeContents(el);
    r.collapse(false);
    getSelection().removeAllRanges();
    getSelection().addRange(r);
  }
}

function probe1_exec(id) {
  log(`--- PROBE 1 (execCommand) on ${id} ---`);
  placeCaretAtEnd(id);
  const ok = document.execCommand('insertText', false, 'đ');
  log(`  execCommand returned: ${ok}`);
  dump(id);
  log(`  EXPECTED cu=[d83d de2d 0111]  BUG cu=[d83d 0111 de2d]`);
}

function probe2_event(id) {
  log(`--- PROBE 2 (synthetic InputEvent) on ${id} ---`);
  placeCaretAtEnd(id);
  const el = document.getElementById(id);
  const ev1 = new InputEvent('beforeinput', { inputType: 'insertText', data: 'đ', bubbles: true, cancelable: true });
  const ev2 = new InputEvent('input', { inputType: 'insertText', data: 'đ', bubbles: true });
  log(`  ev1.isTrusted=${ev1.isTrusted}`);
  el.dispatchEvent(ev1);
  el.dispatchEvent(ev2);
  dump(id);
  log(`  If DOM unchanged → Gecko rejected synthetic InputEvent (expected)`);
}

function reset() {
  document.getElementById('ce').textContent = '😭';
  document.getElementById('ta').value = '😭';
  document.getElementById('in').value = '😭';
  document.getElementById('out').textContent = '';
  log('Reset done.');
}

log('Ready. Initial state:');
dump('ce'); dump('ta'); dump('in');
log('Expected baseline cu=[d83d de2d]');
</script>
</body>
</html>
