# Example test corpus for VKeyTestRunner.
# Schema: see TomlLoader.h.
#
# `keys` is the raw Telex sequence the driver types via SendInput.
# `expected` is what the clipboard should contain after Ctrl+A + Ctrl+C
# (this is what VKey's hook should produce when it processes `keys`).
#
# Use --list to debug-print parsed cases without sending any keystrokes:
#   VKeyTestRunner.exe --list tools/VKeyTestRunner/example.toml

[[tests]]
name = "ascii-passthrough"
target_app = "notepad"
keys = "abc"
expected = "abc"
inter_key_us = 10000

[[tests]]
name = "vieejt-becomes-viet-with-tone"
target_app = "notepad"
keys = "vieejt"
expected = "việt"
inter_key_us = 5000
budget_p99_us = 1500

[[tests]]
name = "ghost-key-toans-bs3-i"
target_app = "notepad"
# Literal string ('...'): TOML does not interpret \b, KeyEscapes does.
keys = 'toans\b\b\bi'
expected = "toi"
inter_key_us = 1000
budget_p99_us = 1500
