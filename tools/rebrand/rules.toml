[meta]
old_brand   = "NexusKey"
new_brand   = "VKey"
keep_namespace = "NextKey"
keep_log_macro = "NEXTKEY_LOG"

[scope]
include = [
    "src/**/*.{cpp,h,rc,manifest,def,idl,in}",
    "src/app/ui/**/*.{html,js,css}",
    "tests/**/*.{cpp,h}",
    "tools/**/*.{cpp,h,py,sh,toml,md,ps1}",
    "rules/**/*.toml",
    "CMakeLists.txt", "**/CMakeLists.txt",
    "*.md",
    "LICENSE-COMMERCIAL",
    "docs/CODING_RULES/**/*.md",
    "docs/Architecture/**/*.md",
    "docs/CODE_GOVERNANCE.md",
    "docs/REFACTOR_STATUS.md",
    "docs/TODO.md",
    "docs/index.md",
    "docs/PHILOSOPHY.md",
    "docs/SECURITY.md",
    "docs/SECURITY_FIXES-distillate.md",
    "docs/macro-case-rules.md",
    "docs/tray-icon-sync-analysis-v2-distillate.md",
    "docs/vietnamese-phonology-spec-distillate.md",
    ".github/**/*.{yml,yaml}",
    "scripts/**/*",
]
exclude = [
    "HANDOFF.md", "GEMINI.md",
    "docs/plans/**", ".planning/**",
    "docs/ghost-chars-chrome-investigation.md",
    "docs/gonhanh-architecture-comparison.md",
    ".agent/**", ".agents/**", "_bmad/**", "_bmad-output/**",
    ".claude/**", ".claude-m/**", ".claude-work/**",
    "build/**", "build-linux/**",
    "extern/**", "src/vendor/**",
    "**/*.png", "**/*.jpg", "**/*.ico",
    "tools/rebrand/**",
    "CLAUDE.md",                          # local AI-assistant guide, gitignored
    "src/core/Version.h",                 # generated from Version.h.in
]

[replacements.brand_string]
"NexusKey"  = "VKey"
"nexuskey"  = "vkey"
"NEXUSKEY"  = "VKEY"

[replacements.binary_name]
"NexusKey.exe"           = "VKey.exe"
"NexusKeyClassic.exe"    = "VKeyClassic.exe"
"NexusKeyTSF.dll"        = "VKeyTSF.dll"
"NexusKeyWatchdog.exe"   = "VKeyWatchdog.exe"
"NextKey.exe"            = "VKey.exe"
"NextKey32.exe"          = "VKey32.exe"
"NexusKey64.exe"         = "VKey64.exe"
"NextKeyEngine"          = "VKeyEngine"
"NextKeyCore"            = "VKeyCore"
"NextKeyTSF"             = "VKeyTSF"
"NextKeyApp"             = "VKeyApp"
"NextKeyLite"            = "VKeyLite"
"NextKeyTests"           = "VKeyTests"
"NextKeyTestRunner"      = "VKeyTestRunner"
"NextKeyTestRunnerTests" = "VKeyTestRunnerTests"
"NexusKeyWatchdog"       = "VKeyWatchdog"

[replacements.runtime_ipc]
'Local\\NexusKeySharedState' = 'Local\\VKeySharedState'
"NexusKeyClassicSettings"    = "VKeyClassicSettings"

[replacements.persistent_id]
'Software\\NexusKey' = 'Software\\VKey'
# TSF CLSID — split into first-3 + last-8 byte groups to match both
# DEFINE_GUID(name, 0xAA..., 0xBB, ...) and { 0xAA..., {0xBB, ...} } shapes.
"0xD84D1E5B, 0x8F2C, 0x4B1A" = "0xDEB18BD1, 0x2331, 0x4F2A"
"0x9D, 0x3E, 0x6F, 0x7A, 0x8B, 0x9C, 0x0D, 0x1E" = "0xB0, 0x30, 0xDA, 0x9E, 0xB0, 0x09, 0x36, 0x83"
# TSF Profile GUID
"0xE95E2F6C, 0x9A3D, 0x5C2B" = "0x2FE17DA4, 0xD8E2, 0x4B28"
"0xAE, 0x4F, 0x7A, 0x8B, 0x9C, 0xAD, 0x1E, 0x2F" = "0x85, 0x66, 0xC3, 0x0E, 0x8F, 0x04, 0xBF, 0xD4"
# Brace-form (string literals + comments referencing the GUID)
"D84D1E5B-8F2C-4B1A-9D3E-6F7A8B9C0D1E" = "DEB18BD1-2331-4F2A-B030-DA9EB0093683"
"E95E2F6C-9A3D-5C2B-AE4F-7A8B9CAD1E2F" = "2FE17DA4-D8E2-4B28-8566-C30E8F04BFD4"

[replacements.release_artifact]
"NexusKey.zip"                       = "VKey.zip"
"NexusKey.zip.sha256"                = "VKey.zip.sha256"
"NexusKey.zip.sigstore.json"         = "VKey.zip.sigstore.json"
"NexusKeyClassic.zip"                = "VKeyClassic.zip"
"NexusKeyClassic.zip.sha256"         = "VKeyClassic.zip.sha256"
"NexusKeyClassic.zip.sigstore.json"  = "VKeyClassic.zip.sigstore.json"
"NexusKey-x64"                       = "VKey-x64"

[persistent_id.guids]
old_clsid_text_service = "{D84D1E5B-8F2C-4B1A-9D3E-6F7A8B9C0D1E}"
new_clsid_text_service = "{deb18bd1-2331-4f2a-b030-da9eb0093683}"
old_profile_guid       = "{E95E2F6C-9A3D-5C2B-AE4F-7A8B9CAD1E2F}"
new_profile_guid       = "{2fe17da4-d8e2-4b28-8566-c30e8f04bfd4}"

[exclude_patterns.namespace_keep]
regex = [
    '\bnamespace\s+NextKey\b',
    '\bNextKey::',
    '\busing\s+NextKey::',
    '\bNEXTKEY_LOG\s*\(',
]

[recategorize]
brand_to_binary_regex = [
    '--target\s+(NextKey|NexusKey)\w*',
    'cmake\s+--build.*--target',
]

[file_renames]
