# Chaos test corpus -- 11 cases derived from the brainstorming session
# (Phase 3 in _bmad-output/brainstorming/brainstorming-session-2026-05-03-1201.md).
#
# Skipped from auto-corpus (require special handling, will land in D8+):
#   3.1, 3.2  -- random-key endurance stress (no deterministic expected)
#   4.1, 4.2  -- manual focus-switch tests (Alt+Tab between apps)
#
# Run via:
#   NextKeyTestRunner.exe --corpus corpus/chaos.toml
#
# All `keys` values are raw Telex sequences (post-VKey-hook the engine
# should produce `expected`). Use TOML literal strings ('...') for sequences
# containing backslash escapes -- our KeyEscapes module resolves them.

# ---------------------------------------------------------------------------
# Group 1: Ghost Key
# ---------------------------------------------------------------------------

[[tests]]
name = "1.1-ghost-hoaf-bs-t"
target_app = "notepad"
keys = 'hoaf\bt'
expected = "hot"
inter_key_us = 10000
budget_p99_us = 1500

[[tests]]
name = "1.2-tone-ghost-toans-bs3-i"
target_app = "notepad"
keys = 'toans\b\b\bi'
expected = "ti"
inter_key_us = 5000
budget_p99_us = 1500

[[tests]]
name = "1.3-escape-bs-aa-b"
target_app = "notepad"
keys = 'aa\bb'
expected = "b"
inter_key_us = 5000
budget_p99_us = 1500

