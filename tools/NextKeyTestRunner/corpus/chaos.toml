# ---------------------------------------------------------------------------
# Group 5: Edge Cases
# ---------------------------------------------------------------------------

[[tests]]
# Brainstorm called for CapsLock+G+CapsOff+iar; we substitute Shift+G to
# avoid mutating system CapsLock state between tests. Driver emits Shift+G
# automatically because VkKeyScanW returns the shift bit for 'G'.
name = "5.1-case-tracking-Giar"
target_app = "notepad"
keys = "Giar"
expected = "Giả"
inter_key_us = 5000
budget_p99_us = 1500

[[tests]]
name = "5.2-vowel-start-uongs"
target_app = "notepad"
keys = "uoongs"
expected = "uống"
inter_key_us = 5000
budget_p99_us = 1500

[[tests]]
# Cross-word backspace replay: type "việt nam", BS x4 to wipe " nam",
# then 's' should retrigger sắc tone on the still-visible "viet" -> "viết".
name = "5.3-cross-word-bs-vieejt-nam-bs4-s"
target_app = "notepad"
keys = 'vieejt nam\b\b\b\bs'
expected = "viết"
inter_key_us = 1000
budget_p99_us = 1500

