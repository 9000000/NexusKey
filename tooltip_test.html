<html>
<head>
<style>
.tooltip-layer {
    position: absolute;
    background: red;
    color: white;
    padding: 10px;
    display: none;
}
</style>
<script type="text/tiscript">
function self.ready() {
    for(var el in self.selectAll("[data-tooltip]")) {
        el.on("mouseenter", function() {
            var text = this.attributes["data-tooltip"];
            var tooltip = self.select(".tooltip-layer");
            tooltip.text = text;
            tooltip.style["display"] = "block";
            var (x, y) = this.box(#position, #client);
            tooltip.style["left"] = x + "px";
            tooltip.style["top"] = (y + this.box(#height) + 5) + "px";
        });
        el.on("mouseleave", function() {
            self.select(".tooltip-layer").style["display"] = "none";
        });
    }
}
</script>
</head>
<body>
<div data-tooltip="Hello Sciter">Hover me</div>
<div class="tooltip-layer"></div>
</body>
</html>
