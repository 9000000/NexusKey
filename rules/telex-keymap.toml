# Telex input method keymap — raw key → AbstractInput.
#
# Source-of-truth lifted from src/core/engine/TypingEngine.cpp:
#   - Tone keys (single press)            : lines 28-33
#   - VNI/Telex method routing            : IsVniMode() / IsTelexMode()
#   - 'w' single-press horn modifier      : ProcessWModifier
#   - 'aa'/'oo'/'ee'/'aw'/'dd' patterns   : kTable diphthong rules + ProcessDModifier
#
# Schema notes:
#   `[mappings]` — raw key (single char) → AbstractInput name.
#   `[double_sequences]` — 2-char trigger (after specific previous state) →
#                          modifier AbstractInput. FSM dispatches via state
#                          transition `(after_first_char, INSERT_LITERAL_x) →
#                          (modifier_applied)` — codegen wires this.
#
# Both AbstractInput names must match the enum codegen emits to
# `src/core/engine/generated/abstract_input.h`. Schema is shared with VNI.

[meta]
method_name = "telex"
spec_source = "src/core/engine/TypingEngine.cpp"

# ─────────────────────────────────────────────────────────────────────────
# Single-press keys — applied without context.
# (Modifier keys 'w' have context-dependent target vowel, but the emit
# mechanism is single-press → MOD_HORN abstract input; FSM picks the target
# vowel from current state.)
# ─────────────────────────────────────────────────────────────────────────

[mappings]
"s" = "TONE_SAC"
"f" = "TONE_HUYEN"
"r" = "TONE_HOI"
"x" = "TONE_NGA"
"j" = "TONE_NANG"
"w" = "MOD_HORN"

# Clear-tone key — Telex 'z' strips tone mark from current syllable
# (counterpart to VNI '0'). Source: TypingEngine.cpp:205.
"z" = "TONE_CLEAR"

# Direct vowel-with-horn shortcuts — Telex full only (Telex Simple omits).
# `]` → ư, `[` → ơ. Anh confirmed 2026-05-05.
# Treated as direct vowel insert (not context-modifier), so abstract inputs
# bypass the MOD_HORN context-resolution that 'w' uses.
"]" = "INSERT_VOWEL_U_HORN"   # direct ư
"[" = "INSERT_VOWEL_O_HORN"   # direct ơ

# Uppercase variants — same abstract input (case-insensitive Telex tone keys).
"S" = "TONE_SAC"
"F" = "TONE_HUYEN"
"R" = "TONE_HOI"
"X" = "TONE_NGA"
"J" = "TONE_NANG"
"W" = "MOD_HORN"
"Z" = "TONE_CLEAR"
# Note: `]` and `[` have no shifted variant on Vietnamese keyboards
# (shifted '}' and '{' produce different chars; not Telex inputs).

# All other ASCII letters → INSERT_LITERAL_<lowercase>. Generated
# automatically by codegen, not enumerated here. Digits 0-9 → literal
# (no Telex meaning attached).

# ─────────────────────────────────────────────────────────────────────────
# Two-char modifier sequences — second char triggers modifier on first.
#
# Each entry maps "xy" where x is the previous typed char (already in FSM
# state) and y is the just-typed char. Codegen wires this as FSM transition
# `(state_with_x, INSERT_LITERAL_y) → (state_with_x_plus_modifier)`.
# ─────────────────────────────────────────────────────────────────────────

[double_sequences]
"aa" = "MOD_CIRCUMFLEX"   # → â
"oo" = "MOD_CIRCUMFLEX"   # → ô
"ee" = "MOD_CIRCUMFLEX"   # → ê
"aw" = "MOD_BREVE"         # → ă
"dd" = "MOD_D_BAR"         # → đ

# 'w' alt forms — equivalent to single 'w' but only when typed after o/u.
# Single 'w' alone (no preceding vowel) and these double forms both produce
# MOD_HORN; the redundancy reflects Telex spec — codegen consolidates.
"ow" = "MOD_HORN"   # → ơ
"uw" = "MOD_HORN"   # → ư

# Uppercase combinations also valid (Vietnamese keyboard often has shift).
"AA" = "MOD_CIRCUMFLEX"
"OO" = "MOD_CIRCUMFLEX"
"EE" = "MOD_CIRCUMFLEX"
"AW" = "MOD_BREVE"
"DD" = "MOD_D_BAR"
"OW" = "MOD_HORN"
"UW" = "MOD_HORN"
