# Telex Simple input method keymap — subset of Telex full.
#
# Per anh 2026-05-05: Telex Simple does NOT have the alt-key shortcuts
# (w, ], [). User must use the standard 2-char modifier sequences instead
# (uw → ư, ow → ơ).
#
# Use case: typing English text mixed with Vietnamese — Telex Simple
# avoids accidental modifier triggers when typing English words containing
# w (e.g. "won", "way") or brackets ([] used in code/markup).
#
# Mappings = Telex full MINUS:
#   - single-press 'w' / 'W' (modifier)
#   - direct ']' / '[' (ư / ơ shortcut)
#
# Double-sequences kept (uw, ow) so user can still type ư/ơ via 2-char.

[meta]
method_name = "telex_simple"
spec_source = "anh confirmed 2026-05-05 — Telex Simple omits w/]/[ shortcuts"

# ─────────────────────────────────────────────────────────────────────────
# Single-press keys — tone keys + clear-tone only.
# (No 'w' standalone, no ']/[' direct shortcuts — those are Telex full only.)
# ─────────────────────────────────────────────────────────────────────────

[mappings]
"s" = "TONE_SAC"
"f" = "TONE_HUYEN"
"r" = "TONE_HOI"
"x" = "TONE_NGA"
"j" = "TONE_NANG"
"z" = "TONE_CLEAR"

"S" = "TONE_SAC"
"F" = "TONE_HUYEN"
"R" = "TONE_HOI"
"X" = "TONE_NGA"
"J" = "TONE_NANG"
"Z" = "TONE_CLEAR"

# ─────────────────────────────────────────────────────────────────────────
# Two-char modifier sequences — same as Telex full.
# Notable: 'uw' / 'ow' kept so ư/ơ remain typable via 2-char sequence.
# ─────────────────────────────────────────────────────────────────────────

[double_sequences]
"aa" = "MOD_CIRCUMFLEX"
"oo" = "MOD_CIRCUMFLEX"
"ee" = "MOD_CIRCUMFLEX"
"aw" = "MOD_BREVE"
"dd" = "MOD_D_BAR"
"ow" = "MOD_HORN"
"uw" = "MOD_HORN"

"AA" = "MOD_CIRCUMFLEX"
"OO" = "MOD_CIRCUMFLEX"
"EE" = "MOD_CIRCUMFLEX"
"AW" = "MOD_BREVE"
"DD" = "MOD_D_BAR"
"OW" = "MOD_HORN"
"UW" = "MOD_HORN"
