# Vietnamese phonotactic rules — source-of-truth for FSM codegen.
#
# Derived from docs/RuleTiengViet_Summary.md (Khá Phạm / DotNetKey research).
# Original PDF: RuleTiengViet.pdf. Counts: 20,504 orthographically-writable
# syllables. ~25% have dictionary meaning.
#
# This file is consumed by tools/fsm-codegen/codegen/parser.py. Edit here
# is the single source-of-truth — re-run codegen to update generated tables.
#
# Schema — DO NOT change without updating parser.py + design doc §5.

[meta]
version = "1.0"
spec_source = "docs/RuleTiengViet_Summary.md"
total_orthographic_syllables = 20504

# ─────────────────────────────────────────────────────────────────────────
# 1. Phụ âm đầu (initial consonants) — 25 total grouped by phonotactic role.
#
# D1 (16, only-initial): cannot appear as final consonant.
# D2 (4): c includes k/qu/qu variants by context rule (see [special_initials]).
# D3 (3): x, gi, ng — ng includes ngh variant.
# ─────────────────────────────────────────────────────────────────────────

[consonants]
initial_d1 = ["b", "d", "đ", "g", "l", "m", "n", "p", "r", "s", "t", "v",
              "ch", "nh", "ph", "tr"]
initial_d2 = ["c", "h", "th", "kh"]
initial_d3 = ["x", "gi", "ng"]

# Context-dependent variants — selected by following vowel per traditional
# Vietnamese orthography. NOT independent initials; expanded by codegen
# from the base initial above.

# c/k/qu rule:
#   c    before vowels in `c_variants.default_before`
#   k    before vowels in `c_variants.k_before`
#   qu   before vowels in `c_variants.qu_before`
[special_initials.c_variants]
default        = "c"                                         # written as 'c'
default_before = ["a", "ă", "â", "o", "ô", "ơ", "u", "ư"]    # bare 'c'
k_before       = ["e", "ê", "i", "y"]                        # written as 'k'
qu_before      = ["oa", "oă", "oe", "uy", "uơ", "uô", "uê", "uâ"]  # written as 'qu'

# g/gh rule: g before non-i/e ; gh only before i/e
[special_initials.g_variants]
default        = "g"
default_before = ["a", "ă", "â", "o", "ô", "ơ", "u", "ư"]
gh_before      = ["i", "e", "ê"]

# ng/ngh rule: same shape as g/gh
[special_initials.ng_variants]
default        = "ng"
default_before = ["a", "ă", "â", "o", "ô", "ơ", "u", "ư"]
ngh_before     = ["i", "e", "ê"]

# ─────────────────────────────────────────────────────────────────────────
# 2. Nguyên âm (vowels) — 53 total per RuleTiengViet doc.
#    Doc says "76 âm vị" counting tonal variants (53 × tones).
#
# Note: 'y' = 'i' phonetically; 'y' may appear in spelling variants
# (huy/hui, ly/li). FSM treats y as i for table purposes; orthographic
# render handled in action layer.
# ─────────────────────────────────────────────────────────────────────────

[vowels]
single = ["a", "ă", "â", "e", "ê", "i", "o", "ô", "ơ", "u", "ư"]   # 11

diphthong = [
    "ai", "ao", "au", "ay", "âu", "ây",
    "eo", "êu",
    "ia", "iê", "iu",
    "oa", "oă", "oe", "oi",
    "ôi",
    "ơi",
    "ua", "uâ", "uê", "ui", "uô", "uơ", "uy",
    "ưa", "ưi", "ươ", "ưu",
    "oo",
]   # 29 — doc lists "ôô" but anh confirmed it does not exist in real
       #  Vietnamese (RuleTiengViet_Summary.md error). "oo" retained for
       #  loanwords like xoong/soong.

triphthong = [
    "iêu",
    "oai", "oay",
    "uây", "uôi", "uyê", "uyu",
    "ươi", "ươu", "uya",
    "oao", "oeo",
]   # 12

# ─────────────────────────────────────────────────────────────────────────
# 3. Phụ âm cuối (final consonants) — 8 total in 3 phonotactic groups.
#
# C1: velar/dental — ng, c
# C2: palatal      — nh, ch
# C3: labial+coronal stops — m, n, p, t
# ─────────────────────────────────────────────────────────────────────────

[final_consonants]
c1 = ["ng", "c"]
c2 = ["nh", "ch"]
c3 = ["m", "n", "p", "t"]

# ─────────────────────────────────────────────────────────────────────────
# 4. Vowel × final-consonant grouping (N1/N2/N3) — orthographic constraint.
#
# N1: only c1 (ng, c) + c3 (m, n, p, t). NOT c2 (nh, ch).
# N2: only c2 (nh, ch) + c3.            NOT c1.
# N3: any of c1, c2, c3.
# ─────────────────────────────────────────────────────────────────────────

[vowel_groupings]
n1 = ["â", "e", "o", "ô", "u", "ư", "ơ", "ă", "oă", "oe", "uâ", "uô", "uơ", "ươ"]
n2 = ["ê", "i", "uê", "uy", "ua"]
n3 = ["a", "oa", "iê", "uyê"]

# ─────────────────────────────────────────────────────────────────────────
# 5. Closed vs suspended vowels (separate constraint dimension from N1/N2/N3).
#
# Closed (28): syllable terminates here, NEVER takes a final consonant.
# Suspended (10): MUST take a final consonant; cannot end syllable alone.
# Other vowels (15): optional — may or may not take a final consonant.
# ─────────────────────────────────────────────────────────────────────────

[vowel_constraints]
closed = [
    "ai", "ao", "au", "ay", "âu", "ây",
    "eo", "êu",
    "ia", "iu",
    "oi", "ôi", "ơi",
    "ui", "ưa", "ưi", "ưu",
    "iêu", "uôi", "uyu",
    "ươi", "ươu",
    "oai", "oay", "uây",
    "uya", "oeo", "oao",
]   # 28

suspended = [
    "ă", "â",
    "iê",
    "oă",
    "uâ", "uô",
    "oo",
    "ươ",
    "uyê",
]   # 9 — "ôô" removed (doc error, anh confirmed). "oo" kept for loanwords.

# ─────────────────────────────────────────────────────────────────────────
# 6. Tone marks — 6 total (1 base + 5 marked).
#
# tones[0] = "none" (no tone mark)
# Codegen produces transitions for each base accept-state × tone for
# tone-overlay (cross product = 6× state count).
# ─────────────────────────────────────────────────────────────────────────

[tones]
all = ["none", "sắc", "huyền", "hỏi", "ngã", "nặng"]

# Hard constraint per traditional Vietnamese orthography.
# Coda c/ch/p/t (the "stopped" finals): only sắc and nặng allowed.
[tone_constraints]
hard_constraint = { codas = ["c", "ch", "p", "t"], allowed = ["sắc", "nặng"] }

# ─────────────────────────────────────────────────────────────────────────
# 7. Tone placement (vị_trí_dấu) — where the diacritic falls.
#
# Single-vowel syllable      → on that vowel.
# Two-vowel syllable         → on FIRST vowel if no final consonant;
#                              on SECOND vowel if final consonant present.
#                              (Plus per-pair classic/modern variants —
#                              see [tone_placement_classic_vs_modern].)
# Three-vowel syllable       → on SECOND vowel (except 'uyê' → on 'ê').
# ─────────────────────────────────────────────────────────────────────────

[tone_placement]
default_2vowel_no_coda  = 1   # 1-indexed, position of the diacritic vowel
default_2vowel_with_coda = 2
default_3vowel = 2
exception_uye = 3   # uyê → tone on ê (3rd char)

# Classic vs Modern orthography differ on these 3 diphthongs only.
# Classic: hòa, hóa, hỏa, hõa, họa     — tone on first vowel 'o'
# Modern : hoà, hoá, hoả, hoã, hoạ     — tone on second vowel 'a'
# Same shape for hoe→hoè and huy→huỳ.
[tone_placement_classic_vs_modern]
diphthongs_with_variant = ["oa", "oe", "uy"]
default_to = "modern"   # NexusKey default per docs/CODING_RULES; user can toggle

# ─────────────────────────────────────────────────────────────────────────
# 8. Modifiers (diacritic marks layered on bare vowel).
#
# Five modifier kinds. Cross-product with tone × base vowel produces full
# Vietnamese vowel inventory.
# ─────────────────────────────────────────────────────────────────────────

[modifiers]
all = ["none", "circumflex", "breve", "horn", "d_bar"]

# Where each modifier applies (constrains FSM state product).
modifier_targets.circumflex = ["a", "o", "e"]      # a→â, o→ô, e→ê
modifier_targets.breve      = ["a"]                 # a→ă
modifier_targets.horn       = ["o", "u"]            # o→ơ, u→ư
modifier_targets.d_bar      = ["d"]                 # d→đ (consonant, not vowel)
