# VNI input method keymap — raw key → AbstractInput.
#
# Source-of-truth lifted from src/core/engine/TypingEngine.cpp:
#   - Tone digits (single press)          : lines 40-45
#   - VNI modifier digits 6-9             : ProcessVniModifier (line 1402)
#       6 → MOD_CIRCUMFLEX  (a→â, o→ô, e→ê)
#       7 → MOD_HORN        (u→ư, o→ơ, uo→ươ)
#       8 → MOD_BREVE       (a→ă)
#       9 → MOD_D_BAR       (d→đ)
#
# Schema mirrors telex-keymap.toml. AbstractInput enum is shared.

[meta]
method_name = "vni"
spec_source = "src/core/engine/TypingEngine.cpp:40-45,1402-1450"

# ─────────────────────────────────────────────────────────────────────────
# Single-press digit keys — context-dependent target vowel handled by FSM
# state, not keymap.
#
# Note: a digit key is BOTH a literal digit AND a Telex/VNI modifier
# depending on whether the syllable is open. FSM resolves: at start-of-
# syllable state, digit is literal; at after-vowel state, digit is modifier.
# ─────────────────────────────────────────────────────────────────────────

[mappings]
# Tone keys
"1" = "TONE_SAC"
"2" = "TONE_HUYEN"
"3" = "TONE_HOI"
"4" = "TONE_NGA"
"5" = "TONE_NANG"

# Modifier keys — abstract symbol; FSM picks target vowel from context.
"6" = "MOD_CIRCUMFLEX"
"7" = "MOD_HORN"
"8" = "MOD_BREVE"
"9" = "MOD_D_BAR"

# Clear-tone key — strips tone mark from current syllable.
# Source: TypingEngine.cpp:206 `IsVniMode() && c == L'0'`.
"0" = "TONE_CLEAR"

# Note: when the previous typed char is also a digit, FSM enters "literal
# digit run" state — subsequent digits including 0-9 are inserted as
# literals (no VNI tone/modifier semantic). FSM table encodes this via
# the digit-after-digit state transition. Source: TypingEngine.cpp:194-201.

# All ASCII letters → INSERT_LITERAL_<lowercase> (no VNI semantics on
# letters; pure VNI uses digits only). Generated by codegen.

# ─────────────────────────────────────────────────────────────────────────
# Combined Telex+VNI mode notes.
#
# When the user selects "Telex + VNI" in Settings, codegen produces a
# COMBINED keymap = telex-keymap.toml ∪ vni-keymap.toml.
#   - Telex letters (s/f/r/x/j/w) → tone/modifier
#   - VNI digits   (1-9)           → tone/modifier
#   - Disjoint key sets ⇒ no merge conflict.
# Combined keymap NOT manually authored here — synthesized by codegen.
# ─────────────────────────────────────────────────────────────────────────
