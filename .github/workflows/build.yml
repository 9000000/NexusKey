name: Build

on:
  push:
    branches: [main, "feature/*"]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build NexusKey
        run: cmake --build build --config Release --target NextKeyApp

      - name: Build TSF DLL
        run: cmake --build build --config Release --target NextKeyTSF

      - name: Build tests
        run: cmake --build build --config Release --target NextKeyTests

      - name: Run tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Zip Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          # Create NextKey-x64.zip for backward compatibility with old updater
          Get-ChildItem "build/Release/*" -Include NexusKey.exe,NextKeyTSF.dll,sciter.dll |
            Compress-Archive -DestinationPath NextKey-x64.zip

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: RELEASE_NOTES.md
          files: |
            NextKey-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexusKey-x64
          path: |
            build/Release/NexusKey.exe
            build/Release/NextKeyTSF.dll
            build/Release/sciter.dll
