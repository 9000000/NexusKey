name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      include_tests:
        # Default true: a tag push always builds the tests, so anything that only
        # breaks them stays invisible across every dispatch and then fails the
        # release. That is exactly what the [[nodiscard]] break in
        # CommitUndoFeatureTest did. Untick this for a deliberately quick build,
        # not as the normal setting.
        description: 'Include tests in the build'
        type: boolean
        default: true
      include_sciter:
        description: 'Include Sciter UI build'
        type: boolean
        default: true
      include_classic:
        description: 'Include Classic UI (Lite) build'
        type: boolean
        default: false
      classic_rust:
        description: 'DEV ONLY: allow Rust in a manual Classic build (never signed or released)'
        type: boolean
        default: false
      include_engine:
        description: 'Include vkey_engine.dll with Sciter artifact output'
        type: boolean
        default: true
      sign_binaries:
        description: 'Sign Classic via SignPath (ignored when Classic is excluded or classic_rust is enabled).'
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write       # OIDC token for cosign keyless signing
  attestations: write   # GitHub native attestation

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check public/private file placement
        run: python3 tools/audit/check_public_tree.py

      - name: Validate release tag matches the compiled version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^project(VKey VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Validate manual Classic options
        if: github.event_name == 'workflow_dispatch' && inputs.classic_rust && !inputs.include_classic
        shell: bash
        run: |
          echo "classic_rust requires include_classic=true" >&2
          exit 1

      - name: Audit hook-thread Rule #11.3 compliance
        run: bash tools/audit/check_hook_thread_no_mutex.sh

      - name: Check asset provenance
        run: python3 tools/audit/check_asset_provenance.py

  # Sciter and Classic intentionally use separate build trees and artifacts.
  # Sciter opts into Rust and remains unsigned in v4.3.
  build-sciter:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/') || inputs.include_sciter
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The engine libraries are no longer committed: they embed CC BY-NC data and
      # are not covered by this repository's GPL-3.0 licence. They are fetched
      # from the exact release named in extern/vkey_engine/engine.release and
      # verified against the committed extern/vkey_engine/engine.lock, which is
      # the trust anchor — not the download.
      - name: Fetch prebuilt engine
        env:
          ENGINE_TOKEN: ${{ secrets.VKEY_ENGINE_TOKEN }}
        shell: bash
        run: |
          if [ -z "${ENGINE_TOKEN}" ]; then
            echo "VKEY_ENGINE_TOKEN is unset or empty." >&2
            echo "The engine release lives in a private repository, so the fetch needs a token." >&2
            echo "Set the secret, or build without the engine: -DVKEY_USE_RUST_ENGINE=OFF." >&2
            exit 1
          fi
          python tools/fetch_engine.py \
            --lock extern/vkey_engine/engine.lock \
            --dest "${{ github.workspace }}/build-engine" \
            --repo phatMT97/VKey-rs \
            --tag "$(tr -d '[:space:]' < extern/vkey_engine/engine.release)" \
            --token "${ENGINE_TOKEN}"

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DVKEY_USE_RUST_ENGINE=ON -DVKEY_ENGINE_ROOT="${{ github.workspace }}/build-engine"

      - name: Build VKey
        run: cmake --build build --config Release --target VKeyApp

      - name: Build TSF DLL
        run: cmake --build build --config Release --target VKeyTSF

      - name: Build Watchdog
        run: cmake --build build --config Release --target VKeyWatchdog

      - name: Build tests
        if: github.event_name != 'workflow_dispatch' || inputs.include_tests
        # VKeyTestRunner lives in the optional private internal submodule.
        # Public CI checkouts omit it; maintainer checkouts build it when present.
        shell: bash
        run: |
          cmake --build build --config Release --target VKeyTests
          if [ -f internal/tools/VKeyTestRunner/CMakeLists.txt ]; then
            cmake --build build --config Release --target VKeyTestRunnerTests
          fi

      - name: Run tests
        if: github.event_name != 'workflow_dispatch' || inputs.include_tests
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Reject a same-name tampered engine
        if: github.event_name != 'workflow_dispatch' || inputs.include_tests
        shell: powershell
        run: |
          $engine = "build/tests/Release/vkey_engine.dll"
          $bytes = [System.IO.File]::ReadAllBytes($engine)
          $bytes[$bytes.Length - 1] = $bytes[$bytes.Length - 1] -bxor 1
          [System.IO.File]::WriteAllBytes($engine, $bytes)

          $output = & "build/tests/Release/VKeyTests.exe" `
            --gtest_filter=RustInputEngineTrustTest.VendoredLibraryPassesTrustChecks 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw "tampered vkey_engine.dll was accepted"
          }
          # Release verifies the detached signature, so a flipped byte now fails as
          # a bad signature rather than a bad hash. "is missing or unreadable" here
          # means the pinned engine release predates signing — cut a new one.
          if (($output -join "`n") -notmatch "was not produced by the VKey engine key") {
            $output | Write-Output
            throw "engine rejection did not report the expected trust failure"
          }

          & "build/tests/Release/VKeyTests.exe" `
            --gtest_filter=EngineFactoryTest.AdvancedConfigKeepsTypingAvailable
          if ($LASTEXITCODE -ne 0) {
            throw "C++ fallback failed after rejecting the tampered engine"
          }

      - name: Gather unsigned Sciter binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path unsigned-sciter-binaries
          Copy-Item "build/Release/VKey.exe" "unsigned-sciter-binaries/" -Force
          Copy-Item "build/Release/VKeyTSF.dll" "unsigned-sciter-binaries/" -Force
          Copy-Item "build/Release/VKeyWatchdog.exe" "unsigned-sciter-binaries/" -Force
          Copy-Item "extern/sciter/bin/sciter.dll" "unsigned-sciter-binaries/" -Force

      - name: Upload unsigned Sciter binaries
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-sciter-binaries
          path: unsigned-sciter-binaries/
          retention-days: 7

  # Official Classic is built without Rust in an independent tree. Its TSF DLL
  # is therefore edition-specific and must never be reused from the Sciter job.
  build-classic:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/') || inputs.include_classic
    runs-on: windows-2022
    outputs:
      artifact-id: ${{ steps.upload-classic.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch prebuilt engine for Classic development variant
        if: github.event_name == 'workflow_dispatch' && inputs.classic_rust
        env:
          ENGINE_TOKEN: ${{ secrets.VKEY_ENGINE_TOKEN }}
        shell: bash
        run: |
          if [ -z "${ENGINE_TOKEN}" ]; then
            echo "VKEY_ENGINE_TOKEN is required for the Classic + Rust development variant." >&2
            exit 1
          fi
          python tools/fetch_engine.py \
            --lock extern/vkey_engine/engine.lock \
            --dest "${{ github.workspace }}/build-engine" \
            --repo phatMT97/VKey-rs \
            --tag "$(tr -d '[:space:]' < extern/vkey_engine/engine.release)" \
            --token "${ENGINE_TOKEN}"

      - name: Configure Classic UI (C++ engine only)
        if: github.event_name != 'workflow_dispatch' || !inputs.classic_rust
        run: cmake -B build-classic -G "Visual Studio 17 2022" -A x64 -DVKEY_LITE_MODE=ON -DVKEY_USE_RUST_ENGINE=OFF

      - name: Configure Classic + Rust development variant
        if: github.event_name == 'workflow_dispatch' && inputs.classic_rust
        run: cmake -B build-classic -G "Visual Studio 17 2022" -A x64 -DVKEY_LITE_MODE=ON -DVKEY_USE_RUST_ENGINE=ON -DVKEY_CLASSIC_ALLOW_RUST_ENGINE_FOR_DEV=ON -DVKEY_ENGINE_ROOT="${{ github.workspace }}/build-engine"

      - name: Build Classic UI and its edition-specific TSF DLL
        run: |
          cmake --build build-classic --config Release --target VKeyLite
          cmake --build build-classic --config Release --target VKeyTSF
          cmake --build build-classic --config Release --target VKeyWatchdog

      - name: Build Classic tests
        if: github.event_name != 'workflow_dispatch' || inputs.include_tests
        shell: bash
        run: |
          cmake --build build-classic --config Release --target VKeyTests
          if [ -f internal/tools/VKeyTestRunner/CMakeLists.txt ]; then
            cmake --build build-classic --config Release --target VKeyTestRunnerTests
          fi

      - name: Run Classic tests
        if: github.event_name != 'workflow_dispatch' || inputs.include_tests
        run: ctest --test-dir build-classic --build-config Release --output-on-failure

      - name: Assert Classic build has no Rust engine artifact
        if: github.event_name != 'workflow_dispatch' || !inputs.classic_rust
        shell: powershell
        run: |
          $forbidden = Get-ChildItem "build-classic/Release" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @("vkey_engine.dll", "vkey_engine.dll.sig", "vkey_engine.LICENSE.txt") }
          if ($forbidden) {
            $forbidden.FullName | Write-Output
            throw "official Classic build contains a Rust engine artifact"
          }

      - name: Assert Classic development build has the Rust engine artifact
        if: github.event_name == 'workflow_dispatch' && inputs.classic_rust
        shell: powershell
        run: |
          foreach ($path in @(
            "build-engine/lib/win-x64/vkey_engine.dll",
            "build-engine/lib/win-x64/vkey_engine.dll.sig"
          )) {
            if (-not (Test-Path $path)) {
              throw "Classic + Rust development build is missing $path"
            }
          }

      - name: Gather Classic binaries for signing
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path unsigned-classic-binaries
          Copy-Item "build-classic/Release/VKeyClassic.exe" "unsigned-classic-binaries/" -Force
          Copy-Item "build-classic/Release/VKeyTSF.dll" "unsigned-classic-binaries/" -Force
          Copy-Item "build-classic/Release/VKeyWatchdog.exe" "unsigned-classic-binaries/" -Force
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.classic_rust }}" -eq "true") {
            Copy-Item "build-engine/lib/win-x64/vkey_engine.dll" "unsigned-classic-binaries/" -Force
            Copy-Item "build-engine/lib/win-x64/vkey_engine.dll.sig" "unsigned-classic-binaries/" -Force
            Copy-Item "extern/vkey_engine/LICENSE" "unsigned-classic-binaries/vkey_engine.LICENSE.txt" -Force
          }

      - name: Upload Classic binaries for signing
        id: upload-classic
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-classic-binaries
          path: unsigned-classic-binaries/
          retention-days: 7

  sign-and-release:
    needs: [validate, build-sciter, build-classic]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.build-sciter.result == 'success' || needs.build-classic.result == 'success') &&
      (needs.build-sciter.result == 'success' || needs.build-sciter.result == 'skipped') &&
      (needs.build-classic.result == 'success' || needs.build-classic.result == 'skipped')
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unsigned Sciter binaries
        if: needs.build-sciter.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: unsigned-sciter-binaries
          path: sciter-binaries

      # SignPath receives only the independently built, C++-only Classic
      # artifact. Sciter and its third-party runtime never cross this boundary.
      - name: Submit Classic signing request to SignPath
        id: signpath-sign
        if: needs.build-classic.result == 'success' && (startsWith(github.ref, 'refs/tags/') || (inputs.sign_binaries && !inputs.classic_rust))
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '8e66dee3-2c1d-407f-a391-0d0d3fd74913'
          project-slug: 'VKey'
          signing-policy-slug: "${{ startsWith(github.ref, 'refs/tags/') && 'release-signing' || 'test-signing' }}"
          github-artifact-id: '${{ needs.build-classic.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'classic-binaries'

      - name: Use unsigned Classic binaries (signing skipped)
        if: needs.build-classic.result == 'success' && !startsWith(github.ref, 'refs/tags/') && (!inputs.sign_binaries || inputs.classic_rust)
        uses: actions/download-artifact@v4
        with:
          name: unsigned-classic-binaries
          path: classic-binaries

      - name: Reconstruct artifact layout
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path upload-payload
          
          if ("${{ needs.build-sciter.result }}" -eq "success") {
            New-Item -ItemType Directory -Force -Path dist
            Copy-Item "sciter-binaries/VKey.exe" "dist/" -Force
            Copy-Item "sciter-binaries/VKeyTSF.dll" "dist/" -Force
            Copy-Item "sciter-binaries/VKeyWatchdog.exe" "dist/" -Force
            Copy-Item "sciter-binaries/sciter.dll" "dist/" -Force
            # Required: Sciter.JS is BSD 3-Clause, whose clause 2 makes the
            # notice a condition of binary redistribution. It has to be inside
            # the archive, not only in the source repo.
            Copy-Item "THIRD_PARTY_NOTICES.txt" "dist/" -Force
            if ("${{ startsWith(github.ref, 'refs/tags/') }}" -eq "true") {
              New-Item -ItemType Directory -Force -Path upload-payload/sciter
              Copy-Item "dist/*" "upload-payload/sciter/" -Force
            }
            else {
              Copy-Item "dist/*" "upload-payload/" -Force
            }
          }
          
          if ("${{ needs.build-classic.result }}" -eq "success") {
            New-Item -ItemType Directory -Force -Path dist-classic
            Copy-Item "classic-binaries/VKeyClassic.exe" "dist-classic/" -Force
            # VKeyTSF.dll is REQUIRED — RegisterTsf() does LoadLibrary("<exe-dir>\VKeyTSF.dll").
            # Without it the Classic build cannot register TSF even when run elevated (issue #199).
            # This TSF DLL comes from the Rust-OFF Classic tree; never reuse the
            # same-named Rust-enabled DLL produced by the Sciter job.
            Copy-Item "classic-binaries/VKeyTSF.dll" "dist-classic/" -Force
            Copy-Item "classic-binaries/VKeyWatchdog.exe" "dist-classic/" -Force
            Copy-Item "THIRD_PARTY_NOTICES.txt" "dist-classic/" -Force
            if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.classic_rust }}" -eq "true") {
              Copy-Item "classic-binaries/vkey_engine.dll" "dist-classic/" -Force
              Copy-Item "classic-binaries/vkey_engine.dll.sig" "dist-classic/" -Force
              Copy-Item "classic-binaries/vkey_engine.LICENSE.txt" "dist-classic/" -Force
            }
            if ("${{ startsWith(github.ref, 'refs/tags/') }}" -eq "true") {
              New-Item -ItemType Directory -Force -Path upload-payload/classic
              Copy-Item "dist-classic/*" "upload-payload/classic/" -Force
            }
            else {
              # Manual artifacts keep the historical flat layout. When both
              # editions are selected, Sciter owns the same-named TSF/watchdog;
              # Classic contributes only its edition-specific executable.
              if ("${{ needs.build-sciter.result }}" -ne "success") {
                Copy-Item "dist-classic/*" "upload-payload/" -Force
              }
              else {
                Copy-Item "dist-classic/VKeyClassic.exe" "upload-payload/" -Force
                if ("${{ inputs.classic_rust }}" -eq "true") {
                  Copy-Item "dist-classic/vkey_engine.dll" "upload-payload/" -Force
                  Copy-Item "dist-classic/vkey_engine.dll.sig" "upload-payload/" -Force
                  Copy-Item "dist-classic/vkey_engine.LICENSE.txt" "upload-payload/" -Force
                }
              }
            }
          }

      - name: Assert v4.3 signing boundary
        shell: powershell
        run: |
          if ("${{ needs.build-sciter.result }}" -eq "success") {
            foreach ($path in @("dist/VKey.exe", "dist/VKeyTSF.dll", "dist/VKeyWatchdog.exe")) {
              $signature = Get-AuthenticodeSignature $path
              if ($signature.Status -ne "NotSigned") {
                throw "Sciter-owned binary must remain unsigned: $path ($($signature.Status))"
              }
            }
          }

          if ("${{ needs.build-classic.result }}" -eq "success") {
            $expectSignature = "${{ startsWith(github.ref, 'refs/tags/') || (inputs.sign_binaries && !inputs.classic_rust) }}" -eq "true"
            foreach ($path in @("dist-classic/VKeyClassic.exe", "dist-classic/VKeyTSF.dll", "dist-classic/VKeyWatchdog.exe")) {
              $signature = Get-AuthenticodeSignature $path
              if ($expectSignature) {
                if ($signature.Status -eq "NotSigned" -or
                    $signature.SignerCertificate.Subject -notmatch "SignPath") {
                  throw "Classic binary was not signed by SignPath: $path ($($signature.Status))"
                }
                if ("${{ startsWith(github.ref, 'refs/tags/') }}" -eq "true" -and
                    $signature.Status -ne "Valid") {
                  throw "release Classic signature is not valid: $path ($($signature.Status))"
                }
              }
              elseif ($signature.Status -ne "NotSigned") {
                throw "manual unsigned Classic build unexpectedly carries a signature: $path"
              }
            }
          }

      # The engine libraries are no longer committed: they embed CC BY-NC data and
      # are not covered by this repository's GPL-3.0 licence. They are fetched
      # from the exact release named in extern/vkey_engine/engine.release and
      # verified against the committed extern/vkey_engine/engine.lock, which is
      # the trust anchor — not the download.
      - name: Fetch prebuilt engine
        if: needs.build-sciter.result == 'success' && (startsWith(github.ref, 'refs/tags/') || inputs.include_engine)
        env:
          ENGINE_TOKEN: ${{ secrets.VKEY_ENGINE_TOKEN }}
        shell: bash
        run: |
          if [ -z "${ENGINE_TOKEN}" ]; then
            echo "VKEY_ENGINE_TOKEN is unset or empty." >&2
            echo "The engine release lives in a private repository, so the fetch needs a token." >&2
            echo "Set the secret, or build without the engine: -DVKEY_USE_RUST_ENGINE=OFF." >&2
            exit 1
          fi
          python tools/fetch_engine.py \
            --lock extern/vkey_engine/engine.lock \
            --dest "${{ github.workspace }}/build-engine" \
            --repo phatMT97/VKey-rs \
            --tag "$(tr -d '[:space:]' < extern/vkey_engine/engine.release)" \
            --token "${ENGINE_TOKEN}"

      - name: Stage external engine asset
        if: needs.build-sciter.result == 'success' && (startsWith(github.ref, 'refs/tags/') || inputs.include_engine)
        shell: powershell
        run: |
          Copy-Item "${{ github.workspace }}/build-engine/lib/win-x64/vkey_engine.dll" "vkey_engine.dll" -Force
          # Release builds verify this signature instead of the lock hash, so the
          # engine without it is unloadable. Fail here rather than ship half of it.
          $sig = "${{ github.workspace }}/build-engine/lib/win-x64/vkey_engine.dll.sig"
          if (-not (Test-Path $sig)) {
            # ASCII only inside a PowerShell string: `shell: powershell` is 5.1 and
            # reads the generated .ps1 as ANSI, so an em dash decodes to a smart
            # quote that closes the string and breaks the parser.
            throw "vkey_engine.dll.sig is missing - the pinned engine release predates signing"
          }
          Copy-Item $sig "vkey_engine.dll.sig" -Force
          # The engine is not covered by this repository's GPL-3.0 license and
          # embeds CC BY-NC data, so its license text has to travel with the
          # binary wherever the binary goes — as a sibling release asset for a
          # tag, and inside the payload for a workflow_dispatch test build.
          Copy-Item "extern/vkey_engine/LICENSE" "vkey_engine.LICENSE.txt" -Force
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.include_engine }}" -eq "true") {
            Copy-Item "${{ github.workspace }}/build-engine/lib/win-x64/vkey_engine.dll" "upload-payload/vkey_engine.dll" -Force
            Copy-Item $sig "upload-payload/vkey_engine.dll.sig" -Force
            Copy-Item "extern/vkey_engine/LICENSE" "upload-payload/vkey_engine.LICENSE.txt" -Force
          }

      - name: Assert engine remains outside app packages
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $forbidden = @(
            "classic-binaries/vkey_engine.dll",
            "classic-binaries/vkey_engine.dll.sig",
            "dist/vkey_engine.dll",
            "dist-classic/vkey_engine.dll",
            "dist/vkey_engine.dll.sig",
            "dist-classic/vkey_engine.dll.sig"
          )
          foreach ($path in $forbidden) {
            if (Test-Path $path) {
              throw "external engine entered app packaging: $path"
            }
          }
          if (-not (Test-Path "vkey_engine.dll")) {
            throw "external engine release asset is missing"
          }
          if (-not (Test-Path "vkey_engine.dll.sig")) {
            throw "external engine signature is missing next to the release asset"
          }
          # The engine is noncommercial-only and embeds CC BY-NC data. Shipping it
          # without its license text is the failure this assertion exists to stop.
          if (-not (Test-Path "vkey_engine.LICENSE.txt")) {
            throw "external engine license is missing next to the release asset"
          }

      # Last gate before anything is archived: the payload is exactly what a
      # licensing scanner downloads and inspects, so check it rather than trusting
      # that the tracked-file gate covered everything that reached it.
      - name: Check release payload for unlicensed assets
        shell: bash
        run: python3 tools/audit/check_asset_provenance.py --dir upload-payload

      # --- Zip releases ---
      - name: Zip Release
        if: startsWith(github.ref, 'refs/tags/') && needs.build-sciter.result == 'success'
        shell: powershell
        run: |
          Compress-Archive -Path "dist/*" -DestinationPath VKey.zip
          Copy-Item VKey.zip VKey-x64.zip -Force

      - name: Zip Classic Release
        if: startsWith(github.ref, 'refs/tags/') && needs.build-classic.result == 'success'
        shell: powershell
        run: |
          Compress-Archive -Path "dist-classic/*" -DestinationPath VKeyClassic.zip
          Copy-Item VKeyClassic.zip VKeyClassic-x64.zip -Force

      # --- SHA-256 checksums ---
      - name: Generate SHA-256 checksums
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          # Generate SHA-256 sidecars used by VerifyDownloadedZip (SEC-001)
          # Format: "<hash>  <filename>" (GNU coreutils sha256sum compatible)
          $files = @()
          if ("${{ needs.build-sciter.result }}" -eq "success") {
            $files += "VKey.zip"
            $files += "VKey-x64.zip"
          }
          if ("${{ needs.build-classic.result }}" -eq "success") {
            $files += "VKeyClassic.zip"
            $files += "VKeyClassic-x64.zip"
          }
          $files += "vkey_engine.dll"
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Out-File -Encoding ascii "$file.sha256"
          }

      # --- GitHub build provenance attestation ---
      - name: Attest VKey
        if: startsWith(github.ref, 'refs/tags/') && needs.build-sciter.result == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            VKey.zip
            VKey-x64.zip

      - name: Attest VKey Classic
        if: startsWith(github.ref, 'refs/tags/') && needs.build-classic.result == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            VKeyClassic.zip
            VKeyClassic-x64.zip

      - name: Attest external engine
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: vkey_engine.dll

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: RELEASE_NOTES.md
          files: |
            VKey.zip
            VKey.zip.sha256
            VKey-x64.zip
            VKey-x64.zip.sha256
            VKeyClassic.zip
            VKeyClassic.zip.sha256
            VKeyClassic-x64.zip
            VKeyClassic-x64.zip.sha256
            vkey_engine.dll
            vkey_engine.dll.sha256
            vkey_engine.LICENSE.txt
          fail_on_unmatched_files: false

      # NOTE: winget-releaser only UPDATES an existing package — both
      # PhatMT97.VKey and PhatMT97.VKey.Classic must be seeded once manually in
      # microsoft/winget-pkgs (zip InstallerType + NestedInstaller) before these
      # steps can succeed. Until then the action exits 1 (package not found).
      - name: Submit VKey (Sciter) to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        if: startsWith(github.ref, 'refs/tags/') && needs.build-sciter.result == 'success'
        with:
          identifier: PhatMT97.VKey
          # Release assets are .zip, not installers — the default regex
          # (exe|msi|msix|appx) matches nothing. Match the -x64.zip release asset
          # so Komac detects the x64 architecture.
          installers-regex: '^VKey-x64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Submit VKey Classic to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        if: startsWith(github.ref, 'refs/tags/') && needs.build-classic.result == 'success'
        with:
          identifier: PhatMT97.VKey.Classic
          installers-regex: '^VKeyClassic-x64\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.classic_rust && 'VKey-Classic-Rust-DEV-x64' || 'VKey-x64' }}
          path: upload-payload/
